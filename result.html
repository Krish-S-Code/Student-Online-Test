
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results | Student Online Test</title>

    <meta http-equiv="refresh" content="2;url=ResultsServlet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f5f3ff;
            background:
                radial-gradient(ellipse at 15% 15%, #49258b44, transparent 45%),
                radial-gradient(ellipse at 85% 85%, #07598535, transparent 45%),
                #090b16;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 42px 32px;
            text-align: center;
            border: 1px solid #ffffff18;
            border-radius: 22px;
            background: #151729ee;
            box-shadow: 0 24px 70px #0005;
        }

        .logo {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;
            font-size: 27px;
            font-weight: 800;
        }

        .brand {
            margin-bottom: 35px;
            font-size: 19px;
            font-weight: 750;
        }

        .brand span {
            color: #a78bfa;
        }

        .result-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 23px;
            border: 1px solid #8b5cf644;
            border-radius: 50%;
            background: #8b5cf61a;
            color: #c4b5fd;
            font-size: 34px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .description {
            color: #a1a1b5;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 27px;
        }

        .loader {
            width: 32px;
            height: 32px;
            margin: 0 auto 15px;
            border: 3px solid #34364d;
            border-top-color: #a78bfa;
            border-right-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status {
            color: #c4b5fd;
            font-size: 13px;
            font-weight: 650;
        }

        .manual-link {
            display: inline-block;
            margin-top: 24px;
            color: #a78bfa;
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }

        .manual-link:hover {
            color: #67e8f9;
            text-decoration: underline;
        }

        .footer {
            margin-top: 35px;
            color: #71738b;
            font-size: 11px;
            line-height: 1.8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader {
                animation-duration: 2s;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">S</div>

        <div class="brand">
            Student <span>Online Test</span>
        </div>

        <div class="result-icon" aria-hidden="true">▤</div>

        <h1>Preparing Your Results</h1>

        <p class="description">
            Your results are being retrieved.
            Please wait while we open your results page.
        </p>

        <div class="loader" aria-hidden="true"></div>

        <p class="status" role="status">
            Redirecting to your results...
        </p>

        <a class="manual-link" href="ResultsServlet">
            Click here if you are not redirected →
        </a>

        <div class="footer">
            Student Online Test and Grade Evaluation System
            <br>
            © 2026 Student Online Test
        </div>
    </main>
</body>
</html>
